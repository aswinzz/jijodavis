<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{title}}</title>
  <meta name="description" content="{{description}}" />
  <meta name="theme-color" content="#0c1014" />
  <link rel="canonical" href="{{url}}" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="{{url}}" />
  <meta property="og:title" content="{{title}}" />
  <meta property="og:description" content="{{description}}" />
  <meta property="og:image" content="{{ogImage}}" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23c8102e'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-family='Arial Narrow,Arial' font-weight='900' font-size='30' fill='white'%3EJD%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Urbanist:wght@400;500;600;700&display=swap" />
  {{preload}}
  <link rel="stylesheet" href="{{css.theme}}" />
  <link rel="stylesheet" href="{{css.styles}}" />
  <script type="application/ld+json">{{jsonld}}</script>
</head>
<body>
  <!-- Built from content/*.json by scripts/build.mjs. Edit the content, not this file. -->
  <div class="progress" aria-hidden="true"><span></span></div>
  <header class="site-header" id="top">{{header}}</header>
  <main id="main">{{main}}</main>
  <footer class="site-footer">{{footer}}</footer>

  <dialog class="lightbox" aria-label="Image viewer">
    <button class="lightbox__close" type="button" aria-label="Close">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <button class="lightbox__nav lightbox__nav--prev" type="button" aria-label="Previous image">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <figure class="lightbox__figure">
      <img alt="" />
      <figcaption></figcaption>
    </figure>
    <button class="lightbox__nav lightbox__nav--next" type="button" aria-label="Next image">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </dialog>

  <script src="{{js.main}}" defer></script>
</body>
</html>
